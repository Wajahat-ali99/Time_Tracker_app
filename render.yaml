# Render Blueprint — https://docs.render.com/docs/blueprint-spec
# New → Blueprint → connect repo → use this file at repo root.

services:
  - type: web
    name: ledger-time-tracker
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
